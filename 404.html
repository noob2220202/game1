<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 Not Alone</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#bbb;font-family:'Gowun Batang',serif;overflow:hidden}
.bg{position:fixed;inset:0;background:url(/assets/img/hallway.jpg) center/cover;filter:grayscale(1) contrast(1.2) brightness(.45);animation:fl 7s infinite}
@keyframes fl{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:.9}97%{opacity:.4}}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 3px)}
.osd{position:fixed;left:14px;top:14px;font:12px ui-monospace,Menlo,monospace;color:#eee;text-shadow:0 1px 2px #000}
.box{position:fixed;left:0;right:0;bottom:12%;text-align:center}
h1{font-size:44px;margin:0;color:#ddd;letter-spacing:2px}h1 em{font-style:normal;color:#b91c1c}
p{font-size:15px;color:#999}a{color:#ddd;border:1px solid #444;padding:10px 20px;border-radius:24px;text-decoration:none;display:inline-block;margin-top:10px}
</style></head><body>
<div class="bg"></div><div class="scan"></div>
<div class="osd" id="osd">CAM 04 · 4F 복도 · REC ●</div>
<div class="box"><h1>404 <em>Not Alone</em></h1><p>잘못 찾아오셨어요. …아니면, 제대로 찾아오셨거나.</p><a href="/">돌아가기</a></div>
<script>setInterval(function(){var d=new Date();document.getElementById('osd').textContent='CAM 04 · 4F 복도 · '+d.toLocaleTimeString('ko-KR',{hour12:false})+' · REC ●'},1000)</script>
</body></html>
